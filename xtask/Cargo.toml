[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Build tooling for Notey's official plugins"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
spellbook = "0.4"
syntect = { version = "5", default-features = false, features = ["parsing", "yaml-load", "regex-fancy"] }
encoding_rs = "0.8"
