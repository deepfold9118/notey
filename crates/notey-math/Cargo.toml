[package]
name = "notey-math"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "The engine of Notey's Math plugin: Calca-style live math in any text, built to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
