[workspace]
members = [".", "xtask"]

[package]
name = "notey"
version = "0.8.2"
edition = "2021"
description = "A native notepad with dark mode, tabs, and spellcheck"
license = "Apache-2.0"

[dependencies]
gpui = "0.2.2"
codemirror-state = { git = "https://github.com/deepfold9118/codemirror-rs", rev = "5e21fb9" }
codemirror-view = { git = "https://github.com/deepfold9118/codemirror-rs", rev = "5e21fb9" }
codemirror-commands = { git = "https://github.com/deepfold9118/codemirror-rs", rev = "5e21fb9" }
codemirror-search = { git = "https://github.com/deepfold9118/codemirror-rs", rev = "5e21fb9" }
chrono = "0.4"
encoding_rs = "0.8"
futures = "0.3"
interprocess = "2"
raw-window-handle = "0.6"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
accesskit = "0.24"
rhai = "1"
arboard = "3"
rfd = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
fancy-regex = "0.18"
ignore = "0.4"
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
sha2 = "0.10"
spellbook = "0.4"
syntect = { version = "5", default-features = false, features = ["parsing", "default-themes", "plist-load", "yaml-load", "dump-load", "dump-create", "regex-fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.32"

[build-dependencies]
winresource = "0.1"

# GPUI and the editor are slow without optimisation; this keeps debug
# builds usable while still building quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
