[package]
name = "notey"
version = "0.3.0"
edition = "2021"
description = "A native notepad with dark mode, tabs, and spellcheck"
license = "Apache-2.0"

[dependencies]
eframe = { version = "0.35", features = ["persistence"] }
rfd = "0.17"
spellbook = "0.4"
chrono = "0.4"
encoding_rs = "0.8"
arboard = "3"
winreg = "0.56"
image = { version = "0.25", default-features = false, features = ["ico"] }
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rhai = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
fancy-regex = "0.18"
ignore = "0.4"
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
egui_commonmark = "0.24"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
