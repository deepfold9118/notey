[workspace]
members = [".", "xtask"]

[package]
name = "notey"
version = "0.7.0"
edition = "2021"
description = "A native notepad with dark mode, tabs, and spellcheck"
license = "Apache-2.0"

[dependencies]
gpui = "0.2.2"
codemirror-state = { path = "../codemirror-rs/crates/state" }
codemirror-view = { path = "../codemirror-rs/crates/view" }
codemirror-commands = { path = "../codemirror-rs/crates/commands" }
codemirror-search = { path = "../codemirror-rs/crates/search" }
chrono = "0.4"
encoding_rs = "0.8"
futures = "0.3"
interprocess = "2"
raw-window-handle = "0.6"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fancy-regex = "0.18"
ignore = "0.4"
sha2 = "0.10"
spellbook = "0.4"
syntect = { version = "5", default-features = false, features = ["parsing", "default-themes", "plist-load", "yaml-load", "dump-load", "dump-create", "regex-fancy"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
winresource = "0.1"

# GPUI and the editor are slow without optimisation; this keeps debug
# builds usable while still building quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
